name: Build and publish prototype

# Публікація йде через гілку gh-pages, а не через Pages API:
# GITHUB_TOKEN не має права створювати Pages-сайт, а на пуш у гілку — має.

on:
  push:
    branches:
      - main
      - claude/rekrutcentr-file-0tx7qy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Прототип лежить не в корені домену, а в /recrutcenter/ — звідси base.
      - run: npm run build
        env:
          SITE: https://igoraidev.github.io
          BASE_PATH: /recrutcenter

      # Без .nojekyll Pages ховає теки, що починаються з підкреслення (_astro).
      - run: touch dist/.nojekyll

      - name: Publish to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Публікація зібраного прототипу: ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
