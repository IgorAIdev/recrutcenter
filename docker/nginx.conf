server {
    # 80 — стандартний порт, 3000 — той, який Coolify та більшість PaaS
    # пробують за замовчуванням. Слухаємо обидва, щоб роздача не залежала
    # від того, який порт вгадає проксі: інакше отримуємо 404 від Traefik
    # і «unhealthy» на цілком робочому контейнері.
    listen 80;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Стиснення: на слабкій мережі це найдешевший виграш.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Хешовані ассети й шрифти можна кешувати назавжди.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(woff2|svg|png|jpg|webp)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML не кешуємо: дані вакансій оновлюються разом із пересбіркою.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
}
